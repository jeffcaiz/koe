name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libxdo-dev libxtst-dev libevdev-dev libglib2.0-dev libgtk-3-dev

      - uses: Swatinem/rust-cache@v2
        with:
          key: x86_64-unknown-linux-gnu

      - name: Build
        run: cargo build --release --package koe-shell --target x86_64-unknown-linux-gnu

      - name: Package
        run: |
          cd target/x86_64-unknown-linux-gnu/release
          tar czf ../../../koe-${{ github.ref_name }}-x86_64-unknown-linux-gnu.tar.gz koe

      - name: Upload
        uses: actions/upload-artifact@v5
        with:
          name: linux-portable
          path: koe-${{ github.ref_name }}-x86_64-unknown-linux-gnu.tar.gz

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          key: x86_64-pc-windows-msvc

      - name: Build
        run: cargo build --release --package koe-shell --target x86_64-pc-windows-msvc

      - name: Package portable zip
        shell: pwsh
        run: |
          Compress-Archive -Path "target/x86_64-pc-windows-msvc/release/koe.exe" -DestinationPath "koe-${{ github.ref_name }}-x86_64-pc-windows-msvc.zip"

      - name: Upload portable
        uses: actions/upload-artifact@v5
        with:
          name: windows-portable
          path: koe-${{ github.ref_name }}-x86_64-pc-windows-msvc.zip

      - name: Build installer
        shell: pwsh
        run: |
          $env:KOE_VERSION = "${{ github.ref_name }}"
          iscc installer\koe.iss

      - name: Upload installer
        uses: actions/upload-artifact@v5
        with:
          name: windows-installer
          path: koe-${{ github.ref_name }}-x86_64-windows-setup.exe

  release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v5
        with:
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: koe-*
