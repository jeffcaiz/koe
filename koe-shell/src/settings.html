<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Koe Settings</title>
<style>
  :root {
    --bg: #1a1a2e;
    --surface: #16213e;
    --border: #2a2a4a;
    --text: #e0e0e0;
    --text-dim: #888;
    --accent: #4a9eff;
    --accent-hover: #6ab4ff;
    --success: #4caf50;
    --error: #f44336;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 0;
    min-height: 100vh;
  }
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 16px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  header h1 {
    font-size: 18px;
    font-weight: 600;
  }
  header .actions {
    display: flex;
    gap: 8px;
  }
  .container {
    max-width: 800px;
    margin: 0 auto;
    padding: 24px;
  }
  .section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 16px;
    overflow: hidden;
  }
  .section-header {
    padding: 12px 16px;
    font-size: 14px;
    font-weight: 600;
    color: var(--accent);
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    user-select: none;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .section-header:hover { background: rgba(255,255,255,0.03); }
  .section-header .arrow { transition: transform 0.2s; }
  .section-header.collapsed .arrow { transform: rotate(-90deg); }
  .section-body { padding: 16px; }
  .section-body.hidden { display: none; }
  .field {
    margin-bottom: 14px;
  }
  .field:last-child { margin-bottom: 0; }
  .field label {
    display: block;
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 4px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .field input, .field select {
    width: 100%;
    padding: 8px 10px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text);
    font-size: 14px;
    font-family: inherit;
  }
  .field input:focus, .field select:focus {
    outline: none;
    border-color: var(--accent);
  }
  .field input[type="checkbox"] {
    width: auto;
    margin-right: 6px;
  }
  .field .hint {
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 2px;
  }
  .row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  btn, .btn {
    padding: 8px 16px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--surface);
    color: var(--text);
    font-size: 13px;
    cursor: pointer;
    font-family: inherit;
  }
  .btn:hover { background: rgba(255,255,255,0.08); }
  .btn-primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .btn-primary:hover { background: var(--accent-hover); }
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    padding: 10px 20px;
    border-radius: 8px;
    font-size: 13px;
    color: #fff;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
    z-index: 100;
  }
  .toast.show { opacity: 1; }
  .toast.success { background: var(--success); }
  .toast.error { background: var(--error); }

  /* Raw YAML editor */
  .yaml-editor {
    margin-top: 16px;
  }
  .yaml-editor textarea {
    width: 100%;
    min-height: 300px;
    padding: 12px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text);
    font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
    font-size: 13px;
    line-height: 1.5;
    resize: vertical;
    tab-size: 2;
  }
  .yaml-editor textarea:focus {
    outline: none;
    border-color: var(--accent);
  }

  .tabs {
    display: flex;
    gap: 0;
    margin-bottom: 16px;
    border-bottom: 1px solid var(--border);
  }
  .tab {
    padding: 10px 20px;
    cursor: pointer;
    font-size: 14px;
    color: var(--text-dim);
    border-bottom: 2px solid transparent;
    transition: all 0.2s;
  }
  .tab:hover { color: var(--text); }
  .tab.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }
  .tab-content { display: none; }
  .tab-content.active { display: block; }
</style>
</head>
<body>

<header>
  <h1>Koe Settings</h1>
  <div class="actions">
    <button class="btn btn-primary" onclick="save()">Save</button>
  </div>
</header>

<div class="container">
  <div class="tabs">
    <div class="tab active" data-tab="form">Form</div>
    <div class="tab" data-tab="yaml">YAML</div>
  </div>

  <!-- Form View -->
  <div id="tab-form" class="tab-content active">

    <!-- ASR -->
    <div class="section">
      <div class="section-header" onclick="toggleSection(this)">
        ASR (Speech Recognition) <span class="arrow">&#9660;</span>
      </div>
      <div class="section-body">
        <div class="field">
          <label>Provider</label>
          <select id="asr-provider">
            <option value="doubaoime">Doubao IME (default, no key needed)</option>
            <option value="doubao">Doubao (official API)</option>
            <option value="qwen">Qwen (Alibaba DashScope)</option>
            <option value="sherpa-onnx">Sherpa-ONNX (local)</option>
          </select>
        </div>
        <div id="asr-qwen-fields" style="display:none">
          <div class="field">
            <label>API Key</label>
            <input type="password" id="asr-qwen-api-key" placeholder="sk-...">
          </div>
          <div class="row">
            <div class="field">
              <label>Model</label>
              <input id="asr-qwen-model" placeholder="paraformer-realtime-v2">
            </div>
            <div class="field">
              <label>Language</label>
              <input id="asr-qwen-language" value="zh" placeholder="zh">
            </div>
          </div>
        </div>
        <div id="asr-doubao-fields" style="display:none">
          <div class="row">
            <div class="field">
              <label>App Key</label>
              <input id="asr-doubao-app-key" placeholder="App key">
            </div>
            <div class="field">
              <label>Access Key</label>
              <input type="password" id="asr-doubao-access-key" placeholder="Access key">
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- LLM -->
    <div class="section">
      <div class="section-header" onclick="toggleSection(this)">
        LLM (Text Correction) <span class="arrow">&#9660;</span>
      </div>
      <div class="section-body">
        <div class="field">
          <label><input type="checkbox" id="llm-enabled" checked> Enable LLM correction</label>
        </div>
        <div class="field">
          <label>Base URL</label>
          <input id="llm-base-url" placeholder="https://api.openai.com/v1">
          <div class="hint">OpenAI-compatible endpoint. Works with OpenAI, DeepSeek, Alibaba Bailian, etc.</div>
        </div>
        <div class="field">
          <label>API Key</label>
          <input type="password" id="llm-api-key" placeholder="sk-...">
        </div>
        <div class="field">
          <label>Model</label>
          <input id="llm-model" placeholder="gpt-4o-mini">
        </div>
      </div>
    </div>

    <!-- Hotkey -->
    <div class="section">
      <div class="section-header" onclick="toggleSection(this)">
        Hotkey <span class="arrow">&#9660;</span>
      </div>
      <div class="section-body">
        <div class="row">
          <div class="field">
            <label>Trigger Key</label>
            <select id="hotkey-trigger">
              <option value="right_alt">Right Alt</option>
              <option value="left_alt">Left Alt</option>
              <option value="f1">F1</option>
              <option value="f2">F2</option>
              <option value="f3">F3</option>
              <option value="f4">F4</option>
              <option value="caps_lock">Caps Lock</option>
              <option value="right_ctrl">Right Ctrl</option>
            </select>
          </div>
          <div class="field">
            <label>Hold Threshold (ms)</label>
            <input type="number" id="hotkey-hold-threshold" value="300" min="100" max="1000">
            <div class="hint">Below this = tap (toggle), above = hold-to-talk</div>
          </div>
        </div>
      </div>
    </div>

  </div>

  <!-- YAML View -->
  <div id="tab-yaml" class="tab-content">
    <div class="yaml-editor">
      <textarea id="yaml-editor" spellcheck="false"></textarea>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
const API = '';

// ─── Tab switching ──────────────────────
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('tab-' + tab.dataset.tab).classList.add('active');
  });
});

// ─── Section toggle ─────────────────────
function toggleSection(header) {
  header.classList.toggle('collapsed');
  header.nextElementSibling.classList.toggle('hidden');
}

// ─── ASR provider toggle ────────────────
document.getElementById('asr-provider').addEventListener('change', function() {
  document.getElementById('asr-qwen-fields').style.display =
    this.value === 'qwen' ? 'block' : 'none';
  document.getElementById('asr-doubao-fields').style.display =
    this.value === 'doubao' ? 'block' : 'none';
});

// ─── Toast ──────────────────────────────
function showToast(msg, type) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast ' + type + ' show';
  setTimeout(() => el.classList.remove('show'), 2000);
}

// ─── Load config ────────────────────────
let rawYaml = '';

async function loadConfig() {
  try {
    const res = await fetch(API + '/api/config');
    rawYaml = await res.text();
    document.getElementById('yaml-editor').value = rawYaml;
    parseYamlToForm(rawYaml);
  } catch (e) {
    showToast('Failed to load config', 'error');
  }
}

function parseYamlToForm(yaml) {
  // Simple key extraction — not a full YAML parser, just reads common fields
  const get = (key) => {
    const re = new RegExp('^\\s*' + key + ':\\s*["\']?([^"\'\\n]*)["\']?', 'm');
    const m = yaml.match(re);
    return m ? m[1].trim() : '';
  };

  // ASR
  const provider = get('provider') || 'doubaoime';
  const sel = document.getElementById('asr-provider');
  for (const opt of sel.options) {
    if (opt.value === provider) { sel.value = provider; break; }
  }
  sel.dispatchEvent(new Event('change'));

  document.getElementById('asr-qwen-api-key').value = get('api_key');
  document.getElementById('asr-qwen-model').value = get('model') || 'paraformer-realtime-v2';
  document.getElementById('asr-qwen-language').value = get('language') || 'zh';

  // LLM �� look for fields under llm/profiles section
  document.getElementById('llm-enabled').checked = get('enabled') !== 'false';
  document.getElementById('llm-base-url').value = get('base_url');
  document.getElementById('llm-api-key').value = get('api_key');
  document.getElementById('llm-model').value = get('model');

  // Hotkey
  const triggerKey = get('trigger_key') || 'fn';
  const hotkeySelect = document.getElementById('hotkey-trigger');
  let found = false;
  for (const opt of hotkeySelect.options) {
    if (opt.value === triggerKey) { hotkeySelect.value = triggerKey; found = true; break; }
  }
  if (!found) hotkeySelect.value = 'right_alt';
}

// ─── Save config ────────────────────────
async function save() {
  // If on YAML tab, use the raw editor content
  const activeTab = document.querySelector('.tab.active').dataset.tab;
  let content;

  if (activeTab === 'yaml') {
    content = document.getElementById('yaml-editor').value;
  } else {
    // Update the YAML with form values
    content = buildYamlFromForm();
  }

  try {
    const res = await fetch(API + '/api/config', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ content }),
    });
    if (res.ok) {
      rawYaml = content;
      document.getElementById('yaml-editor').value = content;
      showToast('Saved! Config reloaded.', 'success');
    } else {
      const err = await res.text();
      showToast('Save failed: ' + err, 'error');
    }
  } catch (e) {
    showToast('Save failed: ' + e, 'error');
  }
}

function buildYamlFromForm() {
  const provider = document.getElementById('asr-provider').value;
  const llmEnabled = document.getElementById('llm-enabled').checked;
  const baseUrl = document.getElementById('llm-base-url').value;
  const apiKey = document.getElementById('llm-api-key').value;
  const model = document.getElementById('llm-model').value;
  const triggerKey = document.getElementById('hotkey-trigger').value;

  let yaml = `asr:\n  provider: "${provider}"\n`;

  if (provider === 'qwen') {
    const qKey = document.getElementById('asr-qwen-api-key').value;
    const qModel = document.getElementById('asr-qwen-model').value || 'paraformer-realtime-v2';
    const qLang = document.getElementById('asr-qwen-language').value || 'zh';
    yaml += `  qwen:\n    api_key: "${qKey}"\n    model: "${qModel}"\n    language: "${qLang}"\n`;
  } else if (provider === 'doubao') {
    const dKey = document.getElementById('asr-doubao-app-key').value;
    const dAccess = document.getElementById('asr-doubao-access-key').value;
    yaml += `  doubao:\n    app_key: "${dKey}"\n    access_key: "${dAccess}"\n`;
  }

  yaml += `\nllm:\n  enabled: ${llmEnabled}\n`;
  if (baseUrl || apiKey || model) {
    yaml += `  profiles:\n    default:\n      provider: "openai"\n`;
    if (baseUrl) yaml += `      base_url: "${baseUrl}"\n`;
    if (apiKey) yaml += `      api_key: "${apiKey}"\n`;
    if (model) yaml += `      model: "${model}"\n`;
  }

  yaml += `\nhotkey:\n  trigger_key: "${triggerKey}"\n`;

  return yaml;
}

// ─── Init ───────────────────────────────
loadConfig();
</script>
</body>
</html>
